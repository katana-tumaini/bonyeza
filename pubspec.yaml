name: bonyeza
description: "a game that involves clicking a button as its size decreases and duration varies"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  flutter_native_splash: ^2.4.6
  cupertino_icons: ^1.0.8
  animated_text_kit: ^4.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  

flutter:

  uses-material-design: true

  assets:
     - assets/emergency-stopp.png
     - assets/step_background.png

  fonts:
    - family: PressStart
      fonts:
        - asset: assets/PressStart2P-Regular.ttf
          style: normal

flutter_native_splash:
  color: "#F49595"
  image: assets/emergency-stopp.png

  android_12:
    color: "#F49595"
    image: assets/emergency-stopp.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/emergency-stopp.png"
